services:
  - type: web
    name: rolefield-olv-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase: { name: rolefield-olv-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: rolefield-olv-queue, property: connectionString }
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: OLV_SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: WEBSITE_SUBSCRIBER_TABLE
        value: rolefield-website-data-subscribers
      - key: WEBSITE_DEMO_BOOKING_TABLE
        value: rolefield-website-data-demo-bookings
      - key: WEBSITE_SENDER_EMAIL
        value: hello@rolefield.ai
      - key: LEAD_NOTIFICATION_EMAIL
        value: arbaz@ai7lab.net
      - key: SUBSCRIBER_NOTIFICATION_EMAIL
        value: arbaz@ai7lab.net
      - key: REPLY_TO_EMAIL
        value: arbaz@ai7lab.net
      - key: SES_REGION
        value: us-east-1
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: INBOUND_SQS_QUEUE_URL
        value: https://sqs.us-east-1.amazonaws.com/271858454098/olv-inbound-production
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true
      - key: SES_EVENT_WEBHOOK_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_ATTACHMENT_BYTES
        value: "25000000"
      - key: MAX_MESSAGE_BYTES
        value: "40000000"
      - key: SESSION_TTL_HOURS
        value: "12"

  - type: worker
    name: rolefield-olv-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm worker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase: { name: rolefield-olv-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: rolefield-olv-queue, property: connectionString }
      - key: AWS_REGION
        value: us-east-1
      - key: SES_REGION
        value: us-east-1
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: INBOUND_SQS_QUEUE_URL
        value: https://sqs.us-east-1.amazonaws.com/271858454098/olv-inbound-production
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"

  - type: keyvalue
    name: rolefield-olv-queue
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: rolefield-olv-postgres
    databaseName: rolefield_olv
    user: rolefield_olv
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
