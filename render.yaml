services:
  - type: web
    name: rolefield-gcc
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: rolefield-postgres
          property: connectionString
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: hello@mail.rolefield.ai
      - key: BREVO_SENDER_NAME
        value: RoleField
      - key: BREVO_DEMO_CUSTOMER_TEMPLATE_ID
        value: 1
      - key: BREVO_CALLBACK_CUSTOMER_TEMPLATE_ID
        value: 2
      - key: BREVO_DEMO_TEAM_TEMPLATE_ID
        value: 3
      - key: BREVO_CALLBACK_TEAM_TEMPLATE_ID
        value: 4
      - key: LEAD_NOTIFICATION_EMAIL
        value: voice@ai7lab.net
      - key: REPLY_TO_EMAIL
        value: voice@ai7lab.net
      - key: NEXT_PUBLIC_SITE_URL
        value: https://rolefield.ai

databases:
  - name: rolefield-postgres
    plan: free
