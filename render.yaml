services:
  - type: web
    name: rolefield-olv-web
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase: { name: rolefield-olv-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: rolefield-olv-queue, property: connectionString }
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: OLV_SESSION_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: SES_REGION
        value: us-east-1
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: INBOUND_SQS_QUEUE_URL
        value: https://sqs.us-east-1.amazonaws.com/271858454098/olv-inbound-production
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: INVITATION_FROM_EMAIL
        sync: false
      - key: INBOUND_WEBHOOK_SECRET
        generateValue: true
      - key: SES_EVENT_WEBHOOK_SECRET
        generateValue: true
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MAX_ATTACHMENT_BYTES
        value: "25000000"
      - key: MAX_MESSAGE_BYTES
        value: "40000000"
      - key: SESSION_TTL_HOURS
        value: "12"

  - type: worker
    name: rolefield-olv-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase: { name: rolefield-olv-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: rolefield-olv-queue, property: connectionString }
      - key: AWS_REGION
        value: us-east-1
      - key: SES_REGION
        value: us-east-1
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: INBOUND_SQS_QUEUE_URL
        value: https://sqs.us-east-1.amazonaws.com/271858454098/olv-inbound-production
      - key: SES_CONFIGURATION_SET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"

  - type: keyvalue
    name: rolefield-olv-queue
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: rolefield-olv-postgres
    databaseName: rolefield_olv
    user: rolefield_olv
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
