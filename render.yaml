services:
  - type: web
    name: rolefield-gcc
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: rolefield-postgres
          property: connectionString

databases:
  - name: rolefield-postgres
    plan: free
